<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/Smile.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />

    <meta
      name="description"
      content="Smile-Secret of Your Happiness is a youth-led social and charitable foundation working on community development, volunteering, education, skill development and humanitarian work in Bangladesh."
    />

    <meta property="og:title" content="Smile-Secret of Your Happiness" />

    <meta
      property="og:description"
      content="A youth-driven organization creating meaningful change through volunteering, education and community development."
    />

    <meta property="og:type" content="website" />

    <meta
      property="og:image"
      content="https://media.db.com/images/public/user_68a877978360d36e853377f1/855b2c83d_image.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var t = localStorage.getItem("smile-theme");
          if (!t)
            t =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";

          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <title>Smile-Secret of Your Happiness</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
